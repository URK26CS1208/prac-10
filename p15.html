
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitSphere Fitness Navigation</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 50px;
    background-color: #121212;
}

/* Navigation Bar */
nav {
    background-color: #1c1c1c;
    display: flex;
    align-items: center;
    height: 65px;
    border-bottom: 2px solid #39ff14;
}

nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
}

nav ul li {
    position: relative;
}

nav ul li a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 22px 18px;
    font-size: 16px;
}

/* Hover Effect */
nav ul li a:hover {
    background-color: #263b32;
    color: #39ff14;
}

/* Dropdown Menu */
.dropdown {
    display: none;
    position: absolute;
    top: 65px;
    left: 0;
    background-color: #222222;
    min-width: 150px;
    flex-direction: column;
    z-index: 1;
    border: 1px solid #39ff14;
}

.dropdown a {
    padding: 15px;
}

nav ul li:hover .dropdown {
    display: flex;
}

/* Login Button */
.login {
    background-color: #263b32;
    margin: 8px;
    padding: 0 !important;
    border-radius: 5px;
}

/* Signup Button */
.signup {
    background-color: #39ff14;
    margin: 8px;
    padding: 0 !important;
    border-radius: 5px;
}

.login a,
.signup a {
    padding: 14px 18px;
}

.signup a {
    color: black;
    font-weight: bold;
}

.login a:hover {
    background-color: #345b40;
}

.signup a:hover {
    background-color: #2bd600;
    color: black;
}
</style>
</head>

<body>

<nav>
<ul>

<li>
<a href="#">Workout ⌄</a>
<div class="dropdown">
<a href="#">Strength Training</a>
<a href="#">Cardio</a>
<a href="#">Yoga</a>
</div>
</li>

<li>
<a href="#">Plans ⌄</a>
<div class="dropdown">
<a href="#">Beginner</a>
<a href="#">Professional</a>
<a href="#">Premium</a>
</div>
</li>

<li>
<a href="#">Contact</a>
</li>

<li class="login">
<a href="#">Log In</a>
</li>

<li class="signup">
<a href="#">Sign Up</a>
</li>

</ul>
</nav>

</body>
</html>
